<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local reading list</title>
<style>body{max-width:52rem;margin:2rem auto;padding:1rem;font:18px/1.5 "Segoe UI",sans-serif;background:#f1faee;color:#1a2332}input{font:inherit;padding:.5rem;width:min(100%,30rem);border:2px solid #2d8b8b}input:focus-visible{outline:3px solid #1a2332;outline-offset:3px}li{padding:.8rem 0;border-bottom:1px solid #2d8b8b}label{display:block;font-weight:600}[hidden]{display:none}</style></head>
<body><main><h1>Local reading list</h1><p>Demonstration entries only. Filtering stays in this page; no data is sent or saved.</p><label for="query">Filter titles</label><input id="query" type="search" autocomplete="off"><p id="count" role="status" aria-live="polite">3 entries</p><ul id="items"><li>Research methods</li><li>Design principles</li><li>Project notes</li></ul><p id="empty" hidden>No matching entries.</p></main>
<script>const input=document.getElementById('query');input.addEventListener('input',()=>{let count=0;for(const item of document.querySelectorAll('#items li')){item.hidden=!item.textContent.toLocaleLowerCase().includes(input.value.toLocaleLowerCase());if(!item.hidden)count++;}document.getElementById('count').textContent=count+' entries';document.getElementById('empty').hidden=count!==0;});</script></body></html>
