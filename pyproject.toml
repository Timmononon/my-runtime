[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aster-runtime"
version = "0.1.5"
description = "A local-first Python agent runtime for Windows and DeepSeek."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1", "pydantic>=2.10,<3", "jsonschema>=4.23,<5",
  "PyYAML>=6,<7", "platformdirs>=4,<5",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "playwright>=1.50,<2",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "python-pptx>=1,<2",
  "pypdfium2>=5,<6", "pillow>=12,<13",
  "croniter>=6,<7", "watchfiles>=1,<2", "tzdata",
  "mcp>=1.10,<2", "keyring>=25,<26", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
bfcl = ["mpmath>=1.3,<2", "rank-bm25==0.2.2"]
bfcl-vector = ["faiss-cpu==1.15.1"]
# Transformers 5.14.1's parallel mmap materializer crashes on this Windows BGE-M3
# checkpoint; keep the established safetensors loading path for local inference.
local-embedding = ["sentence-transformers>=5.6,<6", "transformers>=4.57.6,<5", "torch>=2.6,<3", "safetensors>=0.5,<1"]

[project.scripts]
aster = "aster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aster"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires explicit live API configuration and may incur cost",
  "browser: runs an installed local browser",
  "windows: Windows-specific integration tests",
  "bfcl_native: optional local BFCL native/stress integration; requires ASTER_TEST_BFCL_NATIVE=1",
  "bfcl_evidence: optional BFCL checks using separately retained local corpus or campaign evidence",
]

[tool.ruff]
target-version = "py312"
line-length = 110

